name: Funcionalidade
description: Proponha uma nova funcionalidade ou melhoria
title: 'feat: '
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual necessidade do usuário isto atende?
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O usuário consegue...
        - [ ] O app impede...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [app (lib), testes, pipeline/CI, documentação]
    validations:
      required: true
